name: 模块化构建 xpeng 5.4.302 ReSukiSU (Edge S30)

on:
  workflow_dispatch:
    inputs:
      build_round:
        description: "编译轮次 N（留空 = 自动从 GitHub 已有标签递增：扫描 -r<N> 取最大 +1，如已有 r8 → 自动 r9）"
        required: false
        default: ""
        type: string
      enable_susfs:
        description: "SUSFS v2.3 (路径/挂载/KSTAT隐藏, uname/cmdline欺骗, open重定向)"
        required: true
        default: true
        type: boolean
      enable_rekernel:
        description: "Re:Kernel (冻结 App 的 Binder/Signal 感知)"
        required: true
        default: true
        type: boolean
      enable_droidspaces:
        description: "DroidSpaces (Linux 容器: USER_NS/IPC_NS/PID_NS 等)"
        required: true
        default: true
        type: boolean
      enable_nomount:
        description: "NoMount (对 App 隐藏挂载)"
        required: true
        default: true
        type: boolean
      enable_bbrv3:
        description: "BBRv3 + TCP Brutal (默认拥塞控制 bbr)"
        required: true
        default: true
        type: boolean
      enable_lz4k:
        description: "LZ4K (华为内核压缩算法)"
        required: true
        default: true
        type: boolean
      build_wlan:
        description: "编译 WiFi 模块 (qca_cld3)。不推荐: 通用预编译模块即可, 默认不编译"
        required: false
        default: false
        type: boolean
      update_resukisu:
        description: "更新 KernelSU 到最新 main (会破坏 r8 验证过的 v4.1.0 组合, 慎用)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-modular-edge-s30
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \\
            /usr/share/dotnet \\
            /usr/local/lib/android \\
            /opt/ghc \\
            /opt/hostedtoolcache/CodeQL \\
            /usr/local/share/boost \\
            /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \\
            bison flex bc libssl-dev libelf-dev cpio \\
            python3 curl ca-certificates git rsync xz-utils zip kmod

      - name: Checkout kernel source (this repo)
        uses: actions/checkout@v4
        with:
          path: kernel
          submodules: recursive
          fetch-depth: 0

      - name: Checkout build scripts (LuoJuly)
        uses: actions/checkout@v4
        with:
          repository: LuoJuly/android_kernel_motorola_xpeng_build
          ref: 598f9cdfb27059d6d62fca9d6621a929406969e1  # 5.4.302-s3rxc32.33-8-25-ReSukiSU (pinned)
          path: build
          fetch-depth: 1

      - name: Compute module combination and resolve build round
        id: config
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_REKERNEL: ${{ inputs.enable_rekernel }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_BBRV3: ${{ inputs.enable_bbrv3 }}
          ENABLE_LZ4K: ${{ inputs.enable_lz4k }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}.git"

          # ---- 1) 模块组合 (顺序固定 rekernel,droidspaces,nomount,lz4k,bbrv3,susfs) ----
          MODULES=""
          [ "$ENABLE_REKERNEL" = "true" ] && MODULES="${MODULES}rekernel_"
          [ "$ENABLE_DROIDSPACES" = "true" ] && MODULES="${MODULES}droidspaces_"
          [ "$ENABLE_NOMOUNT" = "true" ] && MODULES="${MODULES}nomount_"
          [ "$ENABLE_LZ4K" = "true" ] && MODULES="${MODULES}lz4k_"
          [ "$ENABLE_BBRV3" = "true" ] && MODULES="${MODULES}bbrv3_"
          [ "$ENABLE_SUSFS" = "true" ] && MODULES="${MODULES}susfs_"
          MODULES=${MODULES%_}
          [ -z "$MODULES" ] && MODULES="base"

          # ---- 2) 编译轮次: 手动优先, 否则自动扫描 GitHub 的 -r<N> 标签 ----
          ROUND_INPUT="${{ inputs.build_round }}"
          if [ -n "$ROUND_INPUT" ]; then
            ROUND="$ROUND_INPUT"
            echo "轮次: 手动指定 r${ROUND}"
          else
            echo "轮次: 自动扫描 ${REPO_URL} 的 -r<N> 标签 ..."
            MAX=0
            # ls-remote 每行: <sha>\trefs/tags/<name>; 取最后一个 -r 之后的部分,
            # 仅纯数字计入 (附注标签 ^{} 行与无 -rN 后缀的标签自动排除)
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              n="${ref##*-r}"
              case "$n" in ''|*[!0-9]*) continue;; esac
              [ "$n" -gt "$MAX" ] && MAX="$n"
            done < <(git ls-remote --tags "$REPO_URL" 2>/dev/null)
            ROUND=$((MAX + 1))
            echo "已有最大轮次: r${MAX} → 本次自动 r${ROUND}"
          fi

          TAG="resukisu-${MODULES}-r${ROUND}"
          {
            echo "MODULES=$MODULES"
            echo "ROUND=$ROUND"
            echo "MAX_EXISTING=${MAX:-0}"
            echo "TAG=$TAG"
            echo "BOOT_IMG=boot_resukisu_${MODULES}_r${ROUND}.img"
            echo "AK3_ZIP=AK3_Xpeng_${MODULES}_r${ROUND}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "模块组合: $MODULES"
          echo "Release tag: $TAG"

          # 准则: 不覆盖已有 release/tag —— 冲突则失败
          if git ls-remote --tags "$REPO_URL" 2>/dev/null | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} 已存在! 自动轮次异常, 请手动指定更大的 build_round。准则: 每次发布新建 tag, 不覆盖。"
            exit 1
          fi

      - name: Inject module selection into ext_config
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_REKERNEL: ${{ inputs.enable_rekernel }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_BBRV3: ${{ inputs.enable_bbrv3 }}
          ENABLE_LZ4K: ${{ inputs.enable_lz4k }}
          MODULES: ${{ steps.config.outputs.MODULES }}
          BUILD_ROUND: ${{ steps.config.outputs.ROUND }}
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          bash .ci/apply_module_config.sh

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: build/.ci-toolchain
          key: toolchain-clang-r383902b1-lineage-gcc49-magisk-v2
          restore-keys: |
            toolchain-clang-r383902b1-lineage-gcc49-

      - name: Build kernel + boot.img + AnyKernel3
        env:
          VARIANT: edge-s30
          KERNEL_SRC: ${{ github.workspace }}/kernel
          ENABLE_NFC: "false"
          BUILD_WLAN: ${{ inputs.build_wlan }}
          UPDATE_RESUKISU: ${{ inputs.update_resukisu }}
          KERNEL_VER_LABEL: "5.4.302"
          ROM_ID: S3RXC32.33-8-25
          CLANG_GIT_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          GCC_GIT_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
          GCC_GIT_BRANCH: lineage-19.1
          GCC_GIT_FALLBACK: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          GCC_GIT_FALLBACK_BRANCH: master-kernel-build-2021
        run: |
          cd "$GITHUB_WORKSPACE/build"
          chmod +x scripts/ci/*.sh scripts/ci/host-bin/* || true
          scripts/ci/build_resukisu_boot.sh

      - name: Rename artifacts and write checksums
        env:
          BOOT_IMG: ${{ steps.config.outputs.BOOT_IMG }}
          AK3_ZIP: ${{ steps.config.outputs.AK3_ZIP }}
          BUILD_ROUND: ${{ steps.config.outputs.ROUND }}
        run: |
          cd "$GITHUB_WORKSPACE/build/.ci-work/edge-s30/release"
          bash "$GITHUB_WORKSPACE/kernel/.ci/rename_artifacts.sh"

      - name: Generate release notes
        env:
          MODULES: ${{ steps.config.outputs.MODULES }}
          BUILD_ROUND: ${{ steps.config.outputs.ROUND }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_REKERNEL: ${{ inputs.enable_rekernel }}
          ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          ENABLE_BBRV3: ${{ inputs.enable_bbrv3 }}
          ENABLE_LZ4K: ${{ inputs.enable_lz4k }}
          BUILD_WLAN: ${{ inputs.build_wlan }}
          BOOT_IMG: ${{ steps.config.outputs.BOOT_IMG }}
          AK3_ZIP: ${{ steps.config.outputs.AK3_ZIP }}
        run: |
          cd "$GITHUB_WORKSPACE/build/.ci-work/edge-s30/release"
          bash "$GITHUB_WORKSPACE/kernel/.ci/gen_release_notes.sh"
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-EdgeS30-5.4.302-${{ steps.config.outputs.MODULES }}-r${{ steps.config.outputs.ROUND }}
          path: |
            build/.ci-work/edge-s30/release/boot_resukisu_*.img
            build/.ci-work/edge-s30/release/AK3_Xpeng_*.zip
            build/.ci-work/edge-s30/release/Image
            build/.ci-work/edge-s30/release/SHA256SUMS_r*.txt
            build/.ci-work/edge-s30/release/RELEASE_NOTES.md
            build/.ci-work/edge-s30/release/wlan_crc_match*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.TAG }}
          name: xpeng 5.4.302 ReSukiSU — ${{ steps.config.outputs.MODULES }} (r${{ steps.config.outputs.ROUND }})
          body_path: build/.ci-work/edge-s30/release/RELEASE_NOTES.md
          files: |
            build/.ci-work/edge-s30/release/boot_resukisu_*.img
            build/.ci-work/edge-s30/release/Image
            build/.ci-work/edge-s30/release/AK3_Xpeng_*.zip
            build/.ci-work/edge-s30/release/SHA256SUMS_r*.txt
            build/.ci-work/edge-s30/release/wlan_crc_match*.zip
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
